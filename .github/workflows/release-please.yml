name: Release Please

# ╔═════════════════════════════════════════════════════════════════════════╗
# ║  On every push to main, release-please parses commits since the last   ║
# ║  release and opens (or updates) a "chore: release vscode-vX.Y.Z" PR    ║
# ║  that bumps every file listed in release-please-config.json.           ║
# ║                                                                          ║
# ║  Merging that PR creates the tag + GitHub Release, and the `publish`   ║
# ║  job below calls release-vscode-extension.yml directly. That works     ║
# ║  even with GITHUB_TOKEN, whose tags don't trigger other workflows.      ║
# ║                                                                          ║
# ║  Need a specific version (e.g. a chore-only patch)? Run this workflow  ║
# ║  manually with `version` = X.Y.Z. It opens a PR carrying a              ║
# ║  `Release-As: X.Y.Z` footer; merge it and release-please does the rest.║
# ║                                                                          ║
# ║  See docs/publishing-vscode-extension.md.                               ║
# ╚═════════════════════════════════════════════════════════════════════════╝

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Force the next release to this version (X.Y.Z). Leave empty to just re-run release-please.'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  force-version:
    if: github.event_name == 'workflow_dispatch' && inputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Open a Release-As PR
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$VERSION' is not a valid X.Y.Z version"
            exit 1
          fi
          CURRENT=$(node -p "require('./.release-please-manifest.json')['packages/azure-migration-squad-vscode']")
          HIGHEST=$(printf '%s\n%s\n' "$CURRENT" "$VERSION" | sort -V | tail -n1)
          if [ "$VERSION" = "$CURRENT" ] || [ "$HIGHEST" != "$VERSION" ]; then
            echo "::error::Version $VERSION must be greater than the last release ($CURRENT)"
            exit 1
          fi
          BRANCH="release-as/$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit --allow-empty -m "chore: release $VERSION" -m "Release-As: $VERSION"
          git push --force origin "$BRANCH"
          BODY=$(printf '%s\n\n%s\n\n%s' \
            "Requested from **Actions → Release Please → Run workflow**. Merging this empty commit tells release-please to open the release PR for **$VERSION**; merge that one to tag and publish." \
            "No files change here — release-please bumps every version location listed in \`release-please-config.json\`." \
            "Release-As: $VERSION")
          if [ "$(gh pr view "$BRANCH" --json state --jq .state 2>/dev/null || true)" = "OPEN" ]; then
            echo "PR for $BRANCH already open"
          else
            gh pr create --base main --head "$BRANCH" --title "chore: release $VERSION" --body "$BODY"
          fi
          echo "### Opened Release-As PR for $VERSION" >> "$GITHUB_STEP_SUMMARY"

  release-please:
    if: github.event_name == 'push' || inputs.version == ''
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs['packages/azure-migration-squad-vscode--release_created'] }}
      tag_name: ${{ steps.release.outputs['packages/azure-migration-squad-vscode--tag_name'] }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # GITHUB_TOKEN is enough to open release PRs and create releases.
          # RELEASE_PLEASE_TOKEN (optional PAT) additionally lets CI checks
          # run on the release PR. Publishing does NOT depend on it; see
          # the `publish` job below.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/release-vscode-extension.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
